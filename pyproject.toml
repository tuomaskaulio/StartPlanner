[project]
name = "startplanner"
version = "0.9.4"
description = "Orienteering start schedule planner"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "lxml",
    "openpyxl",
    "fpdf2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
startplanner = "startplanner.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
