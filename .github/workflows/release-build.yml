name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/startplanner.spec

      - name: Archive build
        run: |
          7z a -tzip StartPlanner-Windows.zip dist/StartPlanner/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartPlanner-Windows
          path: StartPlanner-Windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            suffix: ARM
          - arch: x86-64
            runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/startplanner.spec

      - name: Re-sign bundled binaries
        run: |
          find dist/StartPlanner \( -name "*.so" -o -name "*.dylib" \) -exec codesign --remove-signature {} \; 2>/dev/null || true
          codesign --force --deep --sign - dist/StartPlanner/StartPlanner 2>/dev/null || true

      - name: Copy launcher script
        run: |
          cp packaging/launch_macos.sh dist/StartPlanner/launch_macos.sh
          chmod +x dist/StartPlanner/launch_macos.sh

      - name: Remove quarantine attributes
        run: xattr -rd com.apple.quarantine dist/StartPlanner/

      - name: Archive build
        run: |
          cd dist
          zip -r StartPlanner-macOS-${{ matrix.suffix }}.zip StartPlanner/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartPlanner-macOS-${{ matrix.suffix }}
          path: dist/StartPlanner-macOS-${{ matrix.suffix }}.zip
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: StartPlanner-Windows
          path: release-assets

      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: StartPlanner-macOS-ARM
          path: release-assets

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: StartPlanner-macOS-Intel
          path: release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
